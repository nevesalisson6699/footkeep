<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="cap-sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <clipPath id="cap-clip">
      <path d="M 60 114 C 20 95 14 62 14 20 L 106 20 C 106 62 100 95 60 114 Z" />
    </clipPath>
  </defs>
  <path d="M 60 114 C 20 95 14 62 14 20 L 106 20 C 106 62 100 95 60 114 Z" 
        fill="#c00000" stroke="#111827" stroke-width="3" filter="url(#cap-sh)" />
  <g clip-path="url(#cap-clip)">
    <!-- 4 Diagonal Hurricane Stripes ascending -->
    <polygon points="10,120 30,120 70,50 50,50" fill="#111827" />
    <polygon points="32,120 52,120 92,50 72,50" fill="#111827" />
    <polygon points="54,120 74,120 114,50 94,50" fill="#111827" />
    <polygon points="76,120 96,120 120,78 116,65" fill="#111827" />
    <!-- Upper Header with CAP Monogram -->
    <rect x="14" y="20" width="92" height="28" fill="#111827" stroke="#ffffff" stroke-width="1.5" />
    <text x="60" y="40" text-anchor="middle" fill="#ffffff" font-family="'Arial Black', sans-serif" font-weight="900" font-size="14" letter-spacing="3">C A P</text>
  </g>
  <polygon points="60,4 62,8 66,8 63,11 64.5,15 60,12.5 55.5,15 57,11 54,8 58,8" fill="#fbbf24" />
</svg>